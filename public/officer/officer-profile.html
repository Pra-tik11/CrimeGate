<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crime Gate – Officer Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { font-family: 'Poppins', sans-serif; }

    body {
      background: linear-gradient(135deg, #0a0f28, #1a1a2e);
      min-height: 100vh;
    }

    /* ── Navbar ── */
    .dash-navbar {
      background: linear-gradient(135deg, #0f3460, #1a1a4e);
      padding: 12px 20px;
      border-bottom: 1px solid #2d3a5a;
      position: sticky; top: 0; z-index: 999;
    }
    .navbar-brand { font-size: 20px; font-weight: 800; color: white !important; }
    .navbar-brand span { color: #e94560; }
    .officer-badge-pill {
      background: rgba(233,69,96,0.15);
      border: 1px solid rgba(233,69,96,0.3);
      color: #e94560; padding: 4px 12px;
      border-radius: 20px; font-size: 11px; font-weight: 700;
    }
    .navbar-toggler { border-color: rgba(255,255,255,0.3); }
    .navbar-toggler:focus { box-shadow: none; }
    .navbar-toggler-icon { filter: invert(1); }
    @media (max-width: 991px) {
      .navbar-collapse {
        background: #0f3460; border-radius: 12px;
        padding: 14px; margin-top: 10px;
      }
    }

    /* ── Profile Hero ── */
    .profile-hero {
      background: linear-gradient(135deg, #0f3460, #1e2d5a);
      border-radius: 20px; padding: 36px 32px;
      border: 1px solid #2d3a5a;
      position: relative; overflow: hidden;
    }
    .profile-hero::before {
      content: ''; position: absolute;
      top: -50px; right: -50px;
      width: 220px; height: 220px; border-radius: 50%;
      background: rgba(233,69,96,0.08);
    }
    .profile-hero::after {
      content: ''; position: absolute;
      bottom: -60px; left: -40px;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,0.03);
    }

    /* ── Officer Avatar ── */
    .officer-avatar {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, #e94560, #0f3460);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: white; font-weight: 800;
      border: 4px solid rgba(255,255,255,0.15);
      box-shadow: 0 10px 30px rgba(233,69,96,0.35);
      flex-shrink: 0; position: relative;
    }
    .rank-ribbon {
      position: absolute; bottom: -6px; left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #e94560, #c23152);
      color: white; font-size: 9px; font-weight: 800;
      padding: 2px 10px; border-radius: 10px;
      white-space: nowrap; letter-spacing: 0.5px;
    }

    /* ── Verified / Active Badges ── */
    .badge-active {
      background: rgba(34,197,94,0.15);
      border: 1px solid #22c55e; color: #86efac;
      padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }
    .badge-inactive {
      background: rgba(239,68,68,0.15);
      border: 1px solid #ef4444; color: #fca5a5;
      padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
    }

    /* ── Section Cards ── */
    .section-card {
      background: #161b2e; border-radius: 16px;
      border: 1px solid #2d3a5a; overflow: hidden;
    }
    .section-card-header {
      padding: 18px 24px; border-bottom: 1px solid #2d3a5a;
      display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }
    .section-card-header h6 {
      color: white; font-weight: 700; margin: 0; font-size: 15px;
    }
    .section-card-body { padding: 24px; }

    /* ── Info Rows ── */
    .info-row {
      display: flex; justify-content: space-between;
      align-items: flex-start; padding: 13px 0;
      border-bottom: 1px solid #1e2640;
      gap: 12px; flex-wrap: wrap;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label {
      font-size: 12px; color: #556688;
      text-transform: uppercase; letter-spacing: 0.6px;
      font-weight: 600; min-width: 140px;
    }
    .info-value {
      font-size: 14px; color: white;
      font-weight: 600; text-align: right; flex: 1;
    }

    /* ── Form Controls ── */
    .form-label-cg {
      color: #8899aa; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.8px;
      font-weight: 600; margin-bottom: 7px;
    }
    .form-control-cg {
      background: #0d1117 !important;
      border: 1.5px solid #1e2d4a !important;
      color: white !important; border-radius: 11px !important;
      padding: 12px 16px !important; font-size: 14px !important;
      transition: 0.3s !important; width: 100%;
    }
    .form-control-cg::placeholder { color: #3a4a6a !important; }
    .form-control-cg:focus {
      border-color: #e94560 !important;
      box-shadow: 0 0 0 3px rgba(233,69,96,0.15) !important;
      outline: none !important;
    }
    .form-control-cg:disabled {
      background: #0a0d1a !important;
      color: #556688 !important; cursor: not-allowed;
    }

    /* ── Password Eye ── */
    .input-wrap { position: relative; }
    .pwd-eye {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: #556688; cursor: pointer;
      font-size: 14px; padding: 0; transition: 0.2s;
    }
    .pwd-eye:hover { color: white; }

    /* ── Buttons ── */
    .btn-save {
      background: linear-gradient(135deg, #e94560, #0f3460);
      border: none; color: white; padding: 11px 28px;
      border-radius: 11px; font-weight: 700; font-size: 14px;
      cursor: pointer; transition: 0.3s;
    }
    .btn-save:hover {
      opacity: 0.9; color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(233,69,96,0.4);
    }
    .btn-edit {
      background: #1e2640; border: 1px solid #2d3a5a;
      color: #93c5fd; padding: 7px 16px;
      border-radius: 9px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-edit:hover { background: #2d3a5a; color: white; }
    .btn-cancel {
      background: #1e2640; border: 1px solid #2d3a5a;
      color: #8899aa; padding: 11px 22px;
      border-radius: 11px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-cancel:hover { background: #2d3a5a; color: white; }

    /* ── Stat Pills ── */
    .stat-pill {
      background: rgba(255,255,255,0.05);
      border: 1px solid #2d3a5a; border-radius: 14px;
      padding: 18px; text-align: center; transition: 0.3s;
    }
    .stat-pill:hover { background: rgba(233,69,96,0.1); border-color: #e94560; }
    .stat-pill h4 { font-size: 28px; font-weight: 800; color: #e94560; margin: 0; }
    .stat-pill p  { font-size: 12px; color: #93c5fd; margin: 4px 0 0; font-weight: 600; }

    /* ── Timeline (Recent Activity) ── */
    .activity-item {
      display: flex; gap: 14px; padding: 14px 0;
      border-bottom: 1px solid #1e2640; align-items: flex-start;
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .dot-blue   { background: rgba(59,130,246,0.2);  color: #93c5fd; }
    .dot-green  { background: rgba(34,197,94,0.2);   color: #86efac; }
    .dot-yellow { background: rgba(245,158,11,0.2);  color: #fcd34d; }
    .dot-red    { background: rgba(239,68,68,0.2);   color: #fca5a5; }

    /* ── Password Strength ── */
    #pwdStrengthWrap { margin-top: 8px; }
    #pwdStrengthFill {
      height: 5px; border-radius: 10px;
      background: #ef4444; transition: 0.3s;
    }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, #1e2640 25%, #2d3a5a 50%, #1e2640 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite; border-radius: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Toast ── */
    .toast-cg {
      position: fixed; bottom: 24px; right: 24px;
      border-radius: 14px; padding: 14px 20px;
      color: white; font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      z-index: 99999; min-width: 260px;
      display: flex; align-items: center; gap: 10px;
      transform: translateY(80px); opacity: 0;
      transition: 0.4s ease;
    }
    .toast-cg.show { transform: translateY(0); opacity: 1; }
    .toast-success {
      background: #161b2e; border: 1px solid #22c55e;
      border-left: 4px solid #22c55e;
    }
    .toast-error {
      background: #161b2e; border: 1px solid #ef4444;
      border-left: 4px solid #ef4444;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .profile-hero { padding: 22px 18px; }
      .officer-avatar { width: 75px; height: 75px; font-size: 26px; }
      .section-card-body { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar navbar-expand-lg dash-navbar">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="/">
      <i class="fas fa-shield-alt me-2"></i>Crime<span>Gate</span>
    </a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto ms-3">
        <li class="nav-item">
          <a class="nav-link text-white" href="/officer/officer-dashboard.html">
            <i class="fas fa-tachometer-alt me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white fw-bold" href="/officer/officer-profile.html"
             style="border-bottom: 2px solid #e94560;">
            <i class="fas fa-user-shield me-1"></i>My Profile
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3 mt-2 mt-lg-0 flex-wrap">
        <span class="officer-badge-pill">
          <i class="fas fa-id-badge me-1"></i>
          <span id="navBadge">---</span>
        </span>
        <span class="text-white fw-bold" id="navName"></span>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">
          <i class="fas fa-sign-out-alt me-1"></i>Logout
        </button>
      </div>
    </div>
  </div>
</nav>

<div class="container py-4">

  <!-- Page Title -->
  <div class="mb-4">
    <h4 class="fw-bold mb-1" style="color:white;">
      <i class="fas fa-user-shield me-2" style="color:#e94560;"></i>Officer Profile
    </h4>
    <p style="color:#8899aa;" class="mb-0">
      View and manage your officer account information
    </p>
  </div>

  <!-- ── Profile Hero ── -->
  <div class="profile-hero mb-4" id="profileHero">
    <div class="d-flex align-items-center gap-4 flex-wrap position-relative" style="z-index:1;">
      <div class="skeleton" style="width:100px;height:100px;border-radius:50%;flex-shrink:0;"></div>
      <div style="flex:1; min-width:200px;">
        <div class="skeleton mb-2" style="width:220px;height:28px;"></div>
        <div class="skeleton mb-2" style="width:160px;height:16px;"></div>
        <div class="skeleton"      style="width:200px;height:16px;"></div>
      </div>
    </div>
  </div>

  <div class="row g-4">

    <!-- LEFT COLUMN -->
    <div class="col-lg-7">

      <!-- Personal Info Card -->
      <div class="section-card mb-4">
        <div class="section-card-header">
          <h6>
            <i class="fas fa-id-card me-2" style="color:#e94560;"></i>Personal Information
          </h6>
          <button class="btn-edit" id="editToggleBtn" onclick="toggleEdit()">
            <i class="fas fa-pencil me-1"></i>Edit
          </button>
        </div>
        <div class="section-card-body" id="infoBody">
          <!-- Skeleton -->
          <div class="skeleton mb-3" style="height:20px;"></div>
          <div class="skeleton mb-3" style="height:20px;opacity:.8;"></div>
          <div class="skeleton mb-3" style="height:20px;opacity:.6;"></div>
          <div class="skeleton"      style="height:20px;opacity:.4;"></div>
        </div>
      </div>

      <!-- Change Password Card -->
      <div class="section-card">
        <div class="section-card-header">
          <h6><i class="fas fa-lock me-2" style="color:#e94560;"></i>Change Password</h6>
        </div>
        <div class="section-card-body">
          <div class="row g-3">

            <div class="col-12">
              <label class="form-label-cg">Current Password</label>
              <div class="input-wrap">
                <input type="password" id="curPwd" class="form-control-cg"
                       placeholder="Enter current password"/>
                <button class="pwd-eye" type="button" onclick="toggleEye('curPwd',this)">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="col-sm-6">
              <label class="form-label-cg">New Password</label>
              <div class="input-wrap">
                <input type="password" id="newPwd" class="form-control-cg"
                       placeholder="Min 6 characters"
                       oninput="checkStrength(this.value)"/>
                <button class="pwd-eye" type="button" onclick="toggleEye('newPwd',this)">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <!-- Strength Bar -->
              <div id="pwdStrengthWrap" class="d-none mt-2">
                <div style="background:#1e2640; border-radius:10px; height:5px;">
                  <div id="pwdStrengthFill" style="width:0%; height:5px; border-radius:10px; transition:0.3s;"></div>
                </div>
                <span id="pwdStrengthLabel" style="font-size:11px; font-weight:700;"></span>
              </div>
            </div>

            <div class="col-sm-6">
              <label class="form-label-cg">Confirm New Password</label>
              <div class="input-wrap">
                <input type="password" id="conPwd" class="form-control-cg"
                       placeholder="Repeat new password"/>
                <button class="pwd-eye" type="button" onclick="toggleEye('conPwd',this)">
                  <i class="fas fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="col-12">
              <button class="btn-save" onclick="changePassword()">
                <i class="fas fa-key me-2"></i>Update Password
              </button>
            </div>

          </div>
        </div>
      </div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="col-lg-5">

      <!-- Complaint Stats -->
      <div class="section-card mb-4">
        <div class="section-card-header">
          <h6><i class="fas fa-chart-bar me-2" style="color:#e94560;"></i>My Case Summary</h6>
          <a href="/officer/officer-dashboard.html"
             style="color:#93c5fd; font-size:12px; font-weight:600; text-decoration:none;">
            View All <i class="fas fa-arrow-right ms-1"></i>
          </a>
        </div>
        <div class="section-card-body">
          <div class="row g-3" id="statsContainer">
            <div class="col-6"><div class="skeleton" style="height:85px;border-radius:14px;"></div></div>
            <div class="col-6"><div class="skeleton" style="height:85px;border-radius:14px;opacity:.8;"></div></div>
            <div class="col-6"><div class="skeleton" style="height:85px;border-radius:14px;opacity:.6;"></div></div>
            <div class="col-6"><div class="skeleton" style="height:85px;border-radius:14px;opacity:.4;"></div></div>
          </div>
        </div>
      </div>

      <!-- Station Info -->
      <div class="section-card mb-4">
        <div class="section-card-header">
          <h6><i class="fas fa-building me-2" style="color:#e94560;"></i>Station Details</h6>
        </div>
        <div class="section-card-body" id="stationBody">
          <div class="skeleton mb-3" style="height:18px;"></div>
          <div class="skeleton mb-3" style="height:18px;opacity:.8;"></div>
          <div class="skeleton"      style="height:18px;opacity:.6;"></div>
        </div>
      </div>

      <!-- Account Info -->
      <div class="section-card">
        <div class="section-card-header">
          <h6><i class="fas fa-shield-alt me-2" style="color:#e94560;"></i>Account Details</h6>
        </div>
        <div class="section-card-body" id="accountBody">
          <div class="skeleton mb-3" style="height:18px;"></div>
          <div class="skeleton mb-3" style="height:18px;opacity:.8;"></div>
          <div class="skeleton"      style="height:18px;opacity:.6;"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-cg" id="toastEl">
  <span id="toastIcon"></span>
  <span id="toastMsg"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

  // ── Auth Guard ────────────────────────────────
  const oToken = localStorage.getItem('officerToken');
  const oData  = JSON.parse(localStorage.getItem('officerData') || '{}');
  if (!oToken) window.location.href = '/officer/officer-login.html';

  let officerProfile = {};
  let isEditing      = false;

  // ── Init ──────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('navName').textContent  = oData.name        || 'Officer';
    document.getElementById('navBadge').textContent = oData.badgeNumber || '---';
    loadProfile();
  });

  // ── Load Profile ──────────────────────────────
  async function loadProfile() {
    try {
      const [profileRes, statsRes] = await Promise.all([
        fetch('/api/officers/profile', { headers: { 'Authorization': 'Bearer ' + oToken } }),
        fetch('/api/officers/stats',   { headers: { 'Authorization': 'Bearer ' + oToken } })
      ]);

      if (profileRes.status === 401) { logout(); return; }

      officerProfile = await profileRes.json();
      const stats    = statsRes.ok ? await statsRes.json() : {};

      renderHero(officerProfile);
      renderInfoView(officerProfile);
      renderStationInfo(officerProfile);
      renderAccountInfo(officerProfile);
      renderStats(stats);

    } catch(err) {
      showToast('error','❌','Failed to load profile. Check server.');
    }
  }

  // ── Render Hero ───────────────────────────────
  function renderHero(o) {
    const initials = o.name
      ? o.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2)
      : 'OF';
    const joinDate = new Date(o.createdAt).toLocaleDateString('en-IN',
      { day:'2-digit', month:'long', year:'numeric' });

    document.getElementById('profileHero').innerHTML = `
      <div class="d-flex align-items-center gap-4 flex-wrap position-relative" style="z-index:1;">
        <div style="position:relative;">
          <div class="officer-avatar">
            ${initials}
            <span class="rank-ribbon">${o.rank || 'Officer'}</span>
          </div>
        </div>
        <div style="flex:1; min-width:200px;">
          <h3 style="color:white; font-weight:800; margin:0 0 6px;">${o.name}</h3>
          <div class="d-flex flex-wrap gap-3 mb-8">
            <span style="color:#93c5fd; font-size:14px;">
              <i class="fas fa-id-badge me-1"></i>${o.badgeNumber}
            </span>
            <span style="color:#8899aa; font-size:14px;">
              <i class="fas fa-building me-1"></i>${o.station?.name || 'Unassigned'}
            </span>
          </div>
          <div class="d-flex flex-wrap gap-2 mt-2">
            <span class="${o.status === 'Active' ? 'badge-active' : 'badge-inactive'}">
              <i class="fas fa-circle me-1" style="font-size:8px;"></i>${o.status || 'Active'}
            </span>
            <span style="color:#8899aa; font-size:13px;">
              <i class="fas fa-calendar-alt me-1"></i>Joined ${joinDate}
            </span>
          </div>
        </div>
      </div>`;
  }

  // ── Render Info View (read mode) ──────────────
  function renderInfoView(o) {
    document.getElementById('infoBody').innerHTML = `
      <div class="info-row">
        <span class="info-label"><i class="fas fa-user me-1"></i>Full Name</span>
        <span class="info-value">${o.name}</span>
      </div>
      <div class="info-row">
        <span class="info-label"><i class="fas fa-id-badge me-1"></i>Badge Number</span>
        <span class="info-value" style="font-family:monospace; color:#93c5fd;">${o.badgeNumber}</span>
      </div>
      <div class="info-row">
        <span class="info-label"><i class="fas fa-award me-1"></i>Rank</span>
        <span class="info-value">${o.rank || 'Constable'}</span>
      </div>
      <div class="info-row">
        <span class="info-label"><i class="fas fa-envelope me-1"></i>Email</span>
        <span class="info-value">${o.email || 'Not set'}</span>
      </div>
      <div class="info-row">
        <span class="info-label"><i class="fas fa-phone me-1"></i>Phone</span>
        <span class="info-value">${o.phone || 'Not set'}</span>
      </div>`;
  }

  // ── Render Edit Form ──────────────────────────
  function renderEditForm(o) {
    document.getElementById('infoBody').innerHTML = `
      <div class="row g-3">
        <div class="col-sm-6">
          <label class="form-label-cg">Full Name</label>
          <input type="text" id="editName" class="form-control-cg"
                 value="${o.name}" placeholder="Full name"/>
        </div>
        <div class="col-sm-6">
          <label class="form-label-cg">Badge Number</label>
          <input type="text" class="form-control-cg"
                 value="${o.badgeNumber}" disabled/>
          <small style="color:#556688; font-size:11px;">Badge ID cannot be changed</small>
        </div>
        <div class="col-sm-6">
          <label class="form-label-cg">Email Address</label>
          <input type="email" id="editEmail" class="form-control-cg"
                 value="${o.email || ''}" placeholder="officer@police.gov.in"/>
        </div>
        <div class="col-sm-6">
          <label class="form-label-cg">Phone Number</label>
          <input type="tel" id="editPhone" class="form-control-cg"
                 value="${o.phone || ''}" placeholder="10-digit number"
                 maxlength="10"/>
        </div>
        <div class="col-sm-6">
          <label class="form-label-cg">Rank</label>
          <select id="editRank" class="form-control-cg">
            ${['Constable','Head Constable','ASI','SI','Inspector'].map(r =>
              `<option value="${r}" ${o.rank === r ? 'selected' : ''}>${r}</option>`
            ).join('')}
          </select>
        </div>
        <div class="col-12 d-flex gap-2 flex-wrap mt-2">
          <button class="btn-save" onclick="saveProfile()">
            <i class="fas fa-save me-2"></i>Save Changes
          </button>
          <button class="btn-cancel" onclick="cancelEdit()">
            <i class="fas fa-times me-1"></i>Cancel
          </button>
        </div>
      </div>`;
  }

  // ── Render Station Info ───────────────────────
  function renderStationInfo(o) {
    const station = o.station || {};
    document.getElementById('stationBody').innerHTML = `
      <div class="info-row">
        <span class="info-label"><i class="fas fa-building me-1"></i>Station Name</span>
        <span class="info-value">${station.name || 'Unassigned'}</span>
      </div>
      <div class="info-row">
        <span class="info-label"><i class="fas fa-phone me-1"></i>Station Phone</span>
        <span class="info-value">${station.phone || 'N/A'}</span>
      </div>
      <div class="info-row">
        <span class="info-label"><i class="fas fa-map-marker-alt me-1"></i>Address</span>
        <span class="info-value" style="font-size:13px; font-weight:500;">
          ${station.address || 'N/A'}
        </span>
      </div>`;
  }

  // ── Render Account Info ───────────────────────
  function renderAccountInfo(o) {
    const joined = new Date(o.createdAt).toLocaleDateString('en-IN',
      { day:'2-digit', month:'short', year:'numeric' });
    document.getElementById('accountBody').innerHTML = `
      <div class="info-row">
        <span class="info-label">Account Type</span>
        <span class="info-value">
          <i class="fas fa-user-shield me-1" style="color:#93c5fd;"></i>Police Officer
        </span>
      </div>
      <div class="info-row">
        <span class="info-label">Member Since</span>
        <span class="info-value">${joined}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Account Status</span>
        <span class="${o.status === 'Active' ? 'badge-active' : 'badge-inactive'}">
          <i class="fas fa-circle me-1" style="font-size:8px;"></i>${o.status || 'Active'}
        </span>
      </div>
      <div class="info-row">
        <span class="info-label">Last Updated</span>
        <span class="info-value" style="font-size:13px;">
          ${o.updatedAt ? new Date(o.updatedAt).toLocaleDateString('en-IN',
            {day:'2-digit',month:'short',year:'numeric'}) : 'N/A'}
        </span>
      </div>`;
  }

  // ── Render Stats ──────────────────────────────
  function renderStats(s) {
    document.getElementById('statsContainer').innerHTML = `
      <div class="col-6">
        <div class="stat-pill">
          <h4>${s.total  || 0}</h4>
          <p><i class="fas fa-folder me-1"></i>Total</p>
        </div>
      </div>
      <div class="col-6">
        <div class="stat-pill">
          <h4 style="color:#fcd34d;">${s.active  || 0}</h4>
          <p><i class="fas fa-spinner me-1"></i>Active</p>
        </div>
      </div>
      <div class="col-6">
        <div class="stat-pill">
          <h4 style="color:#86efac;">${s.closed  || 0}</h4>
          <p><i class="fas fa-check-circle me-1"></i>Closed</p>
        </div>
      </div>
      <div class="col-6">
        <div class="stat-pill">
          <h4 style="color:#fca5a5;">${s.submitted || 0}</h4>
          <p><i class="fas fa-clock me-1"></i>Pending</p>
        </div>
      </div>`;
  }

  // ── Toggle Edit ───────────────────────────────
  function toggleEdit() {
    isEditing = !isEditing;
    const btn = document.getElementById('editToggleBtn');
    if (isEditing) {
      btn.innerHTML = '<i class="fas fa-times me-1"></i>Cancel';
      renderEditForm(officerProfile);
    } else {
      cancelEdit();
    }
  }

  function cancelEdit() {
    isEditing = false;
    document.getElementById('editToggleBtn').innerHTML = '<i class="fas fa-pencil me-1"></i>Edit';
    renderInfoView(officerProfile);
  }

  // ── Save Profile ──────────────────────────────
  async function saveProfile() {
    const name  = document.getElementById('editName').value.trim();
    const email = document.getElementById('editEmail').value.trim();
    const phone = document.getElementById('editPhone').value.trim();
    const rank  = document.getElementById('editRank').value;

    if (!name)             { showToast('error','❌','Name is required.'); return; }
    if (phone && phone.length !== 10) { showToast('error','❌','Phone must be 10 digits.'); return; }

    try {
      const res = await fetch('/api/officers/profile', {
        method:  'PUT',
        headers: {
          'Authorization': 'Bearer ' + oToken,
          'Content-Type':  'application/json'
        },
        body: JSON.stringify({ name, email, phone, rank })
      });

      if (!res.ok) {
        const err = await res.json();
        showToast('error','❌', err.message || 'Update failed.'); return;
      }

      officerProfile = await res.json();

      // Sync localStorage
      const stored = JSON.parse(localStorage.getItem('officerData') || '{}');
      stored.name = officerProfile.name;
      stored.rank = officerProfile.rank;
      localStorage.setItem('officerData', JSON.stringify(stored));

      cancelEdit();
      renderHero(officerProfile);
      document.getElementById('navName').textContent = officerProfile.name;
      showToast('success','✅','Profile updated successfully!');

    } catch(err) {
      showToast('error','❌','Server error. Try again.');
    }
  }

  // ── Change Password ───────────────────────────
  async function changePassword() {
    const cur = document.getElementById('curPwd').value;
    const nw  = document.getElementById('newPwd').value;
    const cn  = document.getElementById('conPwd').value;

    if (!cur || !nw || !cn) { showToast('error','❌','Fill all password fields.'); return; }
    if (nw.length < 6)      { showToast('error','❌','Password must be at least 6 chars.'); return; }
    if (nw !== cn)          { showToast('error','❌','New passwords do not match.'); return; }

    try {
      const res = await fetch('/api/officers/change-password', {
        method:  'PUT',
        headers: {
          'Authorization': 'Bearer ' + oToken,
          'Content-Type':  'application/json'
        },
        body: JSON.stringify({ currentPassword: cur, newPassword: nw })
      });

      if (!res.ok) {
        const err = await res.json();
        showToast('error','❌', err.message || 'Incorrect current password.'); return;
      }

      document.getElementById('curPwd').value = '';
      document.getElementById('newPwd').value = '';
      document.getElementById('conPwd').value = '';
      document.getElementById('pwdStrengthWrap').classList.add('d-none');
      showToast('success','🔐','Password changed successfully!');

    } catch(err) {
      showToast('error','❌','Server error. Try again.');
    }
  }

  // ── Password Strength ─────────────────────────
  function checkStrength(val) {
    const wrap  = document.getElementById('pwdStrengthWrap');
    const fill  = document.getElementById('pwdStrengthFill');
    const label = document.getElementById('pwdStrengthLabel');
    if (!val) { wrap.classList.add('d-none'); return; }
    wrap.classList.remove('d-none');

    let score = 0;
    if (val.length >= 6)          score++;
    if (val.length >= 10)         score++;
    if (/[A-Z]/.test(val))        score++;
    if (/[0-9]/.test(val))        score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
      { w:'20%',  c:'#ef4444', t:'Very Weak'  },
      { w:'40%',  c:'#f97316', t:'Weak'       },
      { w:'60%',  c:'#eab308', t:'Fair'       },
      { w:'80%',  c:'#22c55e', t:'Strong'     },
      { w:'100%', c:'#10b981', t:'Very Strong'}
    ];
    const l = levels[Math.min(score, 4)];
    fill.style.width      = l.w;
    fill.style.background = l.c;
    label.textContent     = l.t;
    label.style.color     = l.c;
  }

  // ── Eye Toggle ────────────────────────────────
  function toggleEye(inputId, btn) {
    const inp  = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text'; icon.className = 'fas fa-eye-slash';
    } else {
      inp.type = 'password'; icon.className = 'fas fa-eye';
    }
  }

  // ── Toast ─────────────────────────────────────
  function showToast(type, icon, msg) {
    const el = document.getElementById('toastEl');
    el.className = `toast-cg toast-${type} show`;
    document.getElementById('toastIcon').textContent = icon;
    document.getElementById('toastMsg').textContent  = msg;
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  // ── Logout ────────────────────────────────────
  function logout() {
    localStorage.removeItem('officerToken');
    localStorage.removeItem('officerData');
    window.location.href = '/officer/officer-login.html';
  }

</script>
</body>
</html>
