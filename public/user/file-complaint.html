<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crime Gate – File Complaint</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>

  <style>
    body { background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; }
    .navbar { background: linear-gradient(135deg, #0f3460, #e94560); }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .btn-submit {
      background: linear-gradient(135deg, #0f3460, #e94560);
      border: none; color: white;
    }
    .btn-submit:hover { opacity: 0.9; color: white; }
    .btn-location {
      background: #0f3460; border: none; color: white;
    }
    .btn-location:hover { background: #0a2540; color: white; }
    .location-box {
      background: #f0f8ff;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 15px;
      font-size: 14px;
    }
    #locationStatus { font-size: 13px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-5">
      <i class="fas fa-shield-alt me-2"></i>Crime Gate
    </span>
    <div class="d-flex align-items-center gap-3">
      <span class="text-white" id="welcomeUser"></span>
      <a href="/user/complaint-history.html" class="btn btn-sm btn-outline-light">
        <i class="fas fa-list me-1"></i>My Complaints
      </a>
      <button class="btn btn-sm btn-outline-light" onclick="logout()">
        <i class="fas fa-sign-out-alt me-1"></i>Logout
      </button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-7">

        <div class="card">
          <div class="card-body p-4">

            <h4 class="fw-bold mb-1">
              <i class="fas fa-file-alt me-2 text-danger"></i>File a Complaint
            </h4>
            <p class="text-muted mb-4">Fill the form below to register your FIR online</p>

            <!-- Alert Box -->
            <div id="alertBox" class="alert d-none" role="alert"></div>

            <form id="complaintForm" enctype="multipart/form-data" novalidate>

              <!-- Title -->
              <div class="mb-3">
                <label class="form-label fw-bold">Complaint Title</label>
                <input type="text" id="title" class="form-control"
                  placeholder="e.g. Theft, Assault, Harassment..." required/>
              </div>

              <!-- Description -->
              <div class="mb-3">
                <label class="form-label fw-bold">Incident Description</label>
                <textarea id="description" class="form-control" rows="4"
                  placeholder="Describe the incident in detail..." required></textarea>
              </div>

              <!-- Location -->
              <div class="mb-3">
                <label class="form-label fw-bold">Incident Location</label>
                <input type="text" id="location" class="form-control"
                  placeholder="Street, Area, City..." required/>
              </div>

              <!-- GPS Detection -->
              <div class="mb-3">
                <label class="form-label fw-bold">GPS Coordinates</label>
                <div class="d-flex gap-2 mb-2">
                  <button type="button" class="btn btn-location px-4" onclick="detectLocation()">
                    <i class="fas fa-map-marker-alt me-2"></i>Detect My Location
                  </button>
                  <span id="locationStatus" class="text-muted align-self-center"></span>
                </div>
                <div id="locationBox" class="location-box d-none">
                  <i class="fas fa-check-circle text-success me-2"></i>
                  <span id="locationText"></span>
                </div>
                <input type="hidden" id="latitude"/>
                <input type="hidden" id="longitude"/>
              </div>

              <!-- Evidence Upload -->
              <div class="mb-4">
                <label class="form-label fw-bold">Upload Evidence (Optional)</label>
                <input type="file" id="evidence" class="form-control"
                  accept="image/*,video/*,.pdf"/>
                <div class="form-text">Max 5MB — Images, Videos or PDF allowed</div>
              </div>

              <!-- Submit -->
              <button type="submit" id="submitBtn" class="btn btn-submit w-100 py-2 fw-bold">
                <i class="fas fa-paper-plane me-2"></i>Submit Complaint
              </button>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

<script>
  // ── Auth Check ──────────────────────────────────
  const token = localStorage.getItem('token');
  const user  = JSON.parse(localStorage.getItem('user') || '{}');

  if (!token) window.location.href = '/user/login.html';
  document.getElementById('welcomeUser').textContent = '👋 ' + (user.name || 'User');

  // ── Alert Helper ────────────────────────────────
  function showAlert(type, msg) {
    const box = document.getElementById('alertBox');
    box.className = `alert alert-${type}`;
    box.textContent = msg;
    box.classList.remove('d-none');
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ── Detect GPS Location ─────────────────────────
  function detectLocation() {
    const status = document.getElementById('locationStatus');
    status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Detecting...';

    if (!navigator.geolocation) {
      status.textContent = '❌ Geolocation not supported by your browser.';
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);

        document.getElementById('latitude').value  = lat;
        document.getElementById('longitude').value = lng;
        document.getElementById('locationText').textContent =
          `Latitude: ${lat}, Longitude: ${lng}`;
        document.getElementById('locationBox').classList.remove('d-none');

        // Auto fill location field
        document.getElementById('location').value =
          `Lat: ${lat}, Lng: ${lng}`;

        status.innerHTML = '<span class="text-success">✅ Location detected!</span>';
      },
      (err) => {
        status.textContent = '❌ Location access denied. Enter manually.';
      }
    );
  }

  // ── Submit Form ─────────────────────────────────
  document.getElementById('complaintForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const title       = document.getElementById('title').value.trim();
    const description = document.getElementById('description').value.trim();
    const location    = document.getElementById('location').value.trim();
    const latitude    = document.getElementById('latitude').value;
    const longitude   = document.getElementById('longitude').value;
    const evidenceFile= document.getElementById('evidence').files[0];

    if (!title || !description || !location) {
      showAlert('danger', '❌ Title, description and location are required.');
      return;
    }

    // Loading state
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Submitting...';

    // Use FormData for file upload
    const formData = new FormData();
    formData.append('title',       title);
    formData.append('description', description);
    formData.append('location',    location);
    formData.append('latitude',    latitude);
    formData.append('longitude',   longitude);
    if (evidenceFile) formData.append('evidence', evidenceFile);

    try {
      const res = await fetch('/api/complaints/file', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData   // ⚠️ Do NOT set Content-Type manually with FormData
      });

      const result = await res.json();

      if (res.ok) {
        showAlert('success',
          `✅ Complaint filed! ID: ${result.complaintId} | Assigned to: ${result.assignedTo}`);
        document.getElementById('complaintForm').reset();
        document.getElementById('locationBox').classList.add('d-none');
        document.getElementById('locationStatus').textContent = '';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Submit Complaint';
      } else {
        showAlert('danger', result.msg || '❌ Failed to file complaint.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Submit Complaint';
      }

    } catch (err) {
      showAlert('danger', '❌ Cannot connect to server.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Submit Complaint';
    }
  });

  // ── Logout ──────────────────────────────────────
  function logout() {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/user/login.html';
  }
</script>

</body>
</html>
