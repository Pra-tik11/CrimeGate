<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crime Gate – Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>

  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .card-header {
      background: linear-gradient(135deg, #0f3460, #e94560);
      border-radius: 16px 16px 0 0 !important;
      padding: 24px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0f3460, #e94560);
      border: none;
    }
    .btn-primary:hover { opacity: 0.9; }
    #alertBox { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card">
          <div class="card-header text-center text-white">
            <h3><i class="fas fa-shield-alt me-2"></i>Crime Gate</h3>
            <p class="mb-0">Citizen Registration</p>
          </div>
          <div class="card-body p-4">

            <div id="alertBox" class="alert" role="alert"></div>

            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label fw-bold">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter your full name" required/>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Aadhar Number</label>
                <input type="text" id="aadhar" class="form-control" placeholder="12-digit Aadhar number"
                  maxlength="12" required/>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter email" required/>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create password" required/>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Phone Number</label>
                <input type="text" id="phone" class="form-control" placeholder="10-digit mobile number"
                  maxlength="10" required/>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Address</label>
                <textarea id="address" class="form-control" rows="2" placeholder="Your full address" required></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="fas fa-user-plus me-2"></i>Register
              </button>
            </form>

            <p class="text-center mt-3 mb-0">
              Already have an account?
              <a href="login.html" class="text-decoration-none fw-bold">Login here</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const alertBox = document.getElementById('alertBox');

    // Reset alert
    alertBox.style.display = 'none';
    alertBox.textContent = '';

    // Get values
    const name     = document.getElementById('name').value.trim();
    const aadhar   = document.getElementById('aadhar').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const phone    = document.getElementById('phone').value.trim();
    const address  = document.getElementById('address').value.trim();

    // Frontend Validation
    if (aadhar.length !== 12) {
      showAlert('danger', '❌ Aadhar number must be exactly 12 digits.');
      return;
    }
    if (phone.length !== 10) {
      showAlert('danger', '❌ Phone number must be exactly 10 digits.');
      return;
    }
    if (password.length < 6) {
      showAlert('danger', '❌ Password must be at least 6 characters.');
      return;
    }

    // Show loading state
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Registering...';

    try {
      const res = await fetch('/api/users/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, aadhar, email, password, phone, address })
      });

      const result = await res.json();

      if (res.ok) {
        showAlert('success', '✅ Registration successful! Redirecting to login...');
        setTimeout(() => window.location.href = 'login.html', 2000);
      } else {
        showAlert('danger', result.msg || '❌ Registration failed. Try again.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Register';
      }

    } catch (err) {
      showAlert('danger', '❌ Cannot connect to server. Make sure server is running.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Register';
    }
  });

  function showAlert(type, message) {
    const alertBox = document.getElementById('alertBox');
    alertBox.className = `alert alert-${type}`;
    alertBox.textContent = message;
    alertBox.style.display = 'block';
    // Scroll to alert so user can see it
    alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
</script>
</body>
</html>
