<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crime Gate – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .card-header {
      background: linear-gradient(135deg, #0f3460, #e94560);
      border-radius: 16px 16px 0 0 !important;
      padding: 24px;
    }
    .btn-primary { background: linear-gradient(135deg, #0f3460, #e94560); border: none; }
    .btn-primary:hover { opacity: 0.9; }
    #alertBox { display: none; }

    /* ✅ Fix Other Login buttons - remove red color */
    .other-login-btn {
      color: #aaa !important;
      border-color: #555 !important;
      font-size: 13px;
    }
    .other-login-btn:hover {
      background: #1e2a3a !important;
      color: white !important;
      border-color: #888 !important;
    }
    .other-login-btn i {
      color: inherit !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card">
          <div class="card-header text-center text-white">
            <h3><i class="fas fa-shield-alt me-2"></i>Crime Gate</h3>
            <p class="mb-0">Citizen Login</p>
          </div>
          <div class="card-body p-4">

            <div id="alertBox" class="alert" role="alert"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label fw-bold">Email Address</label>
                <input type="email" id="email" class="form-control"
                  placeholder="Enter your email" required />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="password" class="form-control"
                  placeholder="Enter your password" required />
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="fas fa-sign-in-alt me-2"></i>Login
              </button>
            </form>

            <p class="text-center mt-3 mb-0">
              New user?
              <a href="/userregister" class="text-decoration-none fw-bold">Register here</a>
            </p>

            <hr />
            <p class="text-center text-muted mb-0" style="font-size:13px;">Other Logins</p>
            <div class="d-flex justify-content-center gap-3 mt-2">
              <a href="/officer/officer-login.html" class="btn btn-sm other-login-btn">
                <i class="fas fa-user-shield me-1"></i>Officer
              </a>
              <a href="/stationincharge-login.html" class="btn btn-sm other-login-btn">
                <i class="fas fa-building me-1"></i>Station
              </a>
              <a href="/hq/hq-login.html" class="btn btn-sm other-login-btn">
                <i class="fas fa-landmark me-1"></i>HQ
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Logging in...';

      const data = {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res    = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        alertBox.style.display = 'block';

        if (res.ok) {
          alertBox.className   = 'alert alert-success';
          alertBox.textContent = '✅ Login successful! Redirecting...';

          localStorage.setItem('token', result.token);
          localStorage.setItem('user',  JSON.stringify(result.user));

          setTimeout(() => window.location.href = '/user/dashboard', 1500);

        } else {
          alertBox.className   = 'alert alert-danger';
          alertBox.textContent = result.message || result.msg || '❌ Invalid email or password.';
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
        }

      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.className     = 'alert alert-danger';
        alertBox.textContent   = '❌ Cannot connect to server. Please try again.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
      }
    });
  </script>
</body>
</html>
